; CodeWeek Kassel – Haltestellenanzeige (ESP32 Cheap Yellow Display)
;
; Environments:
;   cyd         Default. The real device: ESP32-2432S028 with ILI9341 display.
;   serial-dev  Same application on any ESP32 board, screens printed to the
;               Serial monitor instead of a display (development/debugging).
;   native      Host unit tests (pio test -e native). No ESP32 needed.
;   preview     Host program that renders a departures JSON exactly like the
;               Serial display (see tools/preview.sh). No ESP32 needed.

[platformio]
default_envs = cyd

; ---------------------------------------------------------------------------
; Shared ESP32 settings
; ---------------------------------------------------------------------------
[esp32]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
; "direct" keeps ANSI colours of the Serial display intact.
monitor_filters = direct, esp32_exception_decoder
; No OTA planned: use the large app partition (Wi-Fi + TLS + web server + TFT).
board_build.partitions = huge_app.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=1
build_src_filter = +<*> -<host/>
lib_deps =
    bblanchon/ArduinoJson@^7.2.0

[env:serial-dev]
extends = esp32
build_flags =
    ${esp32.build_flags}
    -DDISPLAY_BACKEND_SERIAL=1
    -DSERIAL_DISPLAY_ANSI_COLORS=1

[env:cyd]
extends = esp32
; ESP32-2432S028 (ILI9341). Pins are set in src/display/CYDDisplay.cpp.
lib_deps =
    ${esp32.lib_deps}
    adafruit/Adafruit GFX Library@^1.12.6
    adafruit/Adafruit ILI9341@^1.6.4
; Pulled in by the ILI9341 package for other Adafruit boards; no touch in v1.
lib_ignore =
    Adafruit STMPE610
    Adafruit TouchScreen
    Adafruit TSC2007
    Adafruit SH110X
build_flags =
    ${esp32.build_flags}
    -DDISPLAY_BACKEND_CYD=1

; ---------------------------------------------------------------------------
; Host environments (run on the development computer, no ESP32 needed)
; ---------------------------------------------------------------------------
[host]
platform = native
build_flags =
    -std=c++17
    -Wall
    -Itest/native_shim
    -DSERIAL_DISPLAY_ANSI_COLORS=1
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
; Only the hardware-independent core is built on the host.
host_src =
    +<api/DepartureParser.cpp>
    +<app/DisplayModelBuilder.cpp>
    +<config/DeviceConfig.cpp>
    +<display/BoardFormatter.cpp>
    +<student/student_code.cpp>
    +<util/>

[env:native]
extends = host
test_framework = unity
test_build_src = yes
build_src_filter = -<*> ${host.host_src}

[env:preview]
extends = host
build_src_filter = -<*> ${host.host_src} +<host/>
