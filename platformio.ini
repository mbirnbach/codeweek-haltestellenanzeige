; CodeWeek Kassel – Haltestellenanzeige (ESP32 Cheap Yellow Display)
;
; Environments:
;   serial-dev  Default. Full application on any ESP32 board, output on the
;               Serial monitor instead of a display. Use this until the CYD
;               hardware is verified.
;   cyd         Same application with the TFT renderer for the CYD.
;               Display pins/driver are UNVERIFIED placeholders, see README.
;   native      Host unit tests (pio test -e native). No ESP32 needed.
;   preview     Host program that renders a departures JSON exactly like the
;               Serial display (see tools/preview.sh). No ESP32 needed.

[platformio]
default_envs = serial-dev

; ---------------------------------------------------------------------------
; Shared ESP32 settings
; ---------------------------------------------------------------------------
[esp32]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
; "direct" keeps ANSI colours of the Serial display intact.
monitor_filters = direct, esp32_exception_decoder
; No OTA planned: use the large app partition (Wi-Fi + TLS + web server + TFT).
board_build.partitions = huge_app.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=1
build_src_filter = +<*> -<host/>
lib_deps =
    bblanchon/ArduinoJson@^7.2.0

[env:serial-dev]
extends = esp32
build_flags =
    ${esp32.build_flags}
    -DDISPLAY_BACKEND_SERIAL=1
    -DSERIAL_DISPLAY_ANSI_COLORS=1

[env:cyd]
extends = esp32
lib_deps =
    ${esp32.lib_deps}
    bodmer/TFT_eSPI@^2.5.43
; TODO(HARDWARE): every value below is a community-documented default for the
; ESP32-2432S028R ("CYD", ILI9341). NOT verified on our boards. Check the
; exact variant (ILI9341 vs ST7789, USB-C "2USB" variants, ...) before use.
build_flags =
    ${esp32.build_flags}
    -DDISPLAY_BACKEND_CYD=1
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1

; ---------------------------------------------------------------------------
; Host environments (run on the development computer, no ESP32 needed)
; ---------------------------------------------------------------------------
[host]
platform = native
build_flags =
    -std=c++17
    -Wall
    -Itest/native_shim
    -DSERIAL_DISPLAY_ANSI_COLORS=1
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
; Only the hardware-independent core is built on the host.
host_src =
    +<api/DepartureParser.cpp>
    +<app/DisplayModelBuilder.cpp>
    +<config/DeviceConfig.cpp>
    +<display/BoardFormatter.cpp>
    +<student/student_code.cpp>
    +<util/>

[env:native]
extends = host
test_framework = unity
test_build_src = yes
build_src_filter = -<*> ${host.host_src}

[env:preview]
extends = host
build_src_filter = -<*> ${host.host_src} +<host/>
